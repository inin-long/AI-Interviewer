# Copy this file to:
# %LOCALAPPDATA%/AI-Interviewer/config/application-local.yml
# Never commit a real API key.
llm:
  base-url: https://api.example.com
  api-key: ""
  chat-model: ""
  embedding-model: ""
  timeout: 300s
  # Persisted background tasks own retry; avoid multiplying SDK and task retries.
  max-retries: 0
  max-tokens: 2048
  # Optional. SiliconFlow DeepSeek V4 defaults to false for desktop latency.
  # thinking-enabled: false
